name: Deploy Smart Clock to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'smart-clock/**'
      - 'shared/**'
      - 'shared-react/**'
      - '.github/workflows/deploy-smart-clock.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: smart-clock/package-lock.json

      - name: Install smart-clock dependencies
        working-directory: smart-clock
        run: npm ci

      - name: Install shared dependencies
        working-directory: shared
        run: npm ci

      - name: Build
        working-directory: smart-clock
        run: npx vite build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: smart-clock/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
