name: Deploy Smart Clock to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'smart-clock/**'
      - 'shared/**'
      - 'shared-react/**'
      - '.github/workflows/deploy-smart-clock.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: smart-clock/package-lock.json

      - name: Install smart-clock dependencies
        working-directory: smart-clock
        run: npm ci

      - name: Install shared dependencies
        working-directory: shared
        run: npm ci

      - name: Build
        working-directory: smart-clock
        run: npx vite build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: smart-clock/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 40
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          timeout: 1800000
          reporting_interval: 15000

      - name: Verify deployment
        run: |
          echo "Waiting 30s for CDN propagation..."
          sleep 30
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deployment.outputs.page_url }}")
          echo "Site responded with HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Site returned HTTP $HTTP_STATUS instead of 200"
            exit 1
          fi
          BODY=$(curl -s "${{ steps.deployment.outputs.page_url }}")
          if echo "$BODY" | grep -q "/assets/index-"; then
            echo "✓ Live site contains expected asset references"
          else
            echo "::error::Live site does not contain expected asset references"
            exit 1
          fi
